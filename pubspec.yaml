name: saferoute_app
description: "SafeRoute - Flutter app for offline/online maps and route safety."

publish_to: 'none' # This is a private project
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Map and Location
  flutter_map: ^8.2.2
  flutter_map_tile_caching: ^10.1.1
  latlong2: ^0.9.1
  geolocator: ^10.1.1
  connectivity_plus: ^6.1.0
  geocoding: ^3.0.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.3

  # Storage & Offline Support
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # ObjectBox (if using local DB)
  objectbox: ^4.3.1
  objectbox_flutter_libs: ^4.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets for the app
  assets:
    - assets/shelters.json
    - assets/hazards.json
    - assets/roads.json
    - assets/emergency_services.json

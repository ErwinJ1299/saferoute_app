name: saferoute_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # 🗺️ Map and Location Packages
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^10.1.1

  # 💾 Storage & Offline Support
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  flutter_map_tile_caching: ^9.1.4  # Replaces flutter_offline_map

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/shelters.json
    - assets/hazards.json
    - assets/roads.json
